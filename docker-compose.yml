version: '3.8'

services:
  neural-link-middleware:
    build: .
    container_name: neural-link-middleware
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      # - GEMINI_API_KEY=
      # - AES_SECRET_KEY=
      # - FIREBASE_PROJECT_ID=
      # - BELLAS_API_URL=http://aegis-core:8080
    networks:
      - nexus-mesh

networks:
  nexus-mesh:
    external: true
